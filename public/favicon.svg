<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Clock face -->
  <circle cx="32" cy="32" r="28" fill="hsl(258,85%,65%)" opacity="0.15"/>
  <circle cx="32" cy="32" r="28" stroke="hsl(258,85%,65%)" stroke-width="3.5"/>
  <!-- Hour marks -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="hsl(258,85%,65%)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="56" stroke="hsl(258,85%,65%)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="14" y2="32" stroke="hsl(258,85%,65%)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="56" y2="32" stroke="hsl(258,85%,65%)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hour hand (pointing to ~10) -->
  <line x1="32" y1="32" x2="20" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~12) -->
  <line x1="32" y1="32" x2="32" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="hsl(258,85%,65%)"/>
</svg>