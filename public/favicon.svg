<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181333"/>
      <stop offset="100%" stop-color="#0c0919"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <!-- Clock Outer Ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#ringGrad)" stroke-width="3" opacity="0.95"/>
  <!-- Cardinal Hour Ticks -->
  <line x1="32" y1="13" x2="32" y2="17" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="51" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="32" x2="17" y2="32" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="32" x2="51" y2="32" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
  <!-- Hour Hand (~10:10) -->
  <line x1="32" y1="32" x2="22" y2="22" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute Hand -->
  <line x1="32" y1="32" x2="42" y2="22" stroke="#ffffff" stroke-width="2.25" stroke-linecap="round"/>
  <!-- Center Pivot Dot -->
  <circle cx="32" cy="32" r="3" fill="#a78bfa"/>
  <circle cx="32" cy="32" r="1.2" fill="#ffffff"/>
</svg>