<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5fa" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="index, follow" />

    <!-- Primary SEO — Managed per route by prerender and client SEO manager -->
    <title>Time Tools — Free Online Clocks, Timers & Converters</title>
    <meta name="description" content="Free, fast, and beautifully designed online time utilities: digital and analog clocks, precision stopwatch, countdown timers, Pomodoro focus timer, timezone converter, and more." />
    <link rel="canonical" href="https://time.sji.one/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Time Tools — Free Online Clocks, Timers & Converters" />
    <meta property="og:description" content="Free, fast, and beautifully designed online time utilities: digital clocks, stopwatch, timers, timezone converter, and more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://time.sji.one/" />
    <meta property="og:site_name" content="Time Tools" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Time Tools — Free Online Clocks, Timers & Converters" />
    <meta name="twitter:description" content="Free, fast, and beautifully designed browser-based time utilities. No ads, no sign-up, works offline." />

    <!-- Prevent Flash of Unstyled Theme (FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' ? 'light' : (saved === 'dark' ? 'dark' : (prefersDark ? 'dark' : 'light'));
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
